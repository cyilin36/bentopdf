name: Release

# 只由 tag 触发：
#   v1.2.0        -> 稳定版：GitHub Release（latest）+ GHCR 镜像 :v1.2.0 / :1.2.0 / :latest
#   v1.2.0-beta.1 -> 预发布：GitHub Release（Pre-release）+ GHCR 镜像 :v1.2.0-beta.1 / :1.2.0-beta.1 / :pre，不覆盖 latest
on:
  push:
    tags:
      - 'v*'

jobs:
  # 构建 full / simple 两个发行包并创建 GitHub Release
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "预发布版本: ${VERSION}"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "稳定版本: ${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build full distribution
        run: npm run build

      - name: Package full distribution
        run: |
          cd dist
          zip -r "../dist-${{ steps.version.outputs.version }}.zip" .

      - name: Build simple distribution
        run: SIMPLE_MODE=true npm run build

      - name: Package simple distribution
        run: |
          cd dist
          zip -r "../dist-simple-${{ steps.version.outputs.version }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-${{ steps.version.outputs.version }}.zip
            dist-simple-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 分别在 amd64 / arm64 原生 runner 上构建镜像，先推 -amd64 / -arm64 中间 tag
  docker-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: default
            simple_mode: false
            suffix: ''
          - name: simple
            simple_mode: true
            suffix: '-simple'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 ${{ matrix.mode.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SIMPLE_MODE=${{ matrix.mode.simple_mode }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/bentopdf${{ matrix.mode.suffix }}:${{ steps.version.outputs.version }}-amd64
          platforms: linux/amd64
          cache-from: type=gha,scope=amd64-${{ matrix.mode.name }}
          cache-to: type=gha,mode=max,scope=amd64-${{ matrix.mode.name }}

  docker-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: default
            simple_mode: false
            suffix: ''
          - name: simple
            simple_mode: true
            suffix: '-simple'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 ${{ matrix.mode.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SIMPLE_MODE=${{ matrix.mode.simple_mode }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/bentopdf${{ matrix.mode.suffix }}:${{ steps.version.outputs.version }}-arm64
          platforms: linux/arm64
          cache-from: type=gha,scope=arm64-${{ matrix.mode.name }}
          cache-to: type=gha,mode=max,scope=arm64-${{ matrix.mode.name }}

  # 合并两个架构的 manifest：稳定版覆盖 latest，预发布打 pre（绝不覆盖 latest）
  publish-manifests:
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: default
            suffix: ''
          - name: simple
            suffix: '-simple'
    steps:
      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/bentopdf${{ matrix.mode.suffix }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:v${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"

          if [ "${PRERELEASE}" = "true" ]; then
            # 预发布：只额外打 pre 浮动 tag，不碰 latest
            docker buildx imagetools create -t "${IMAGE}:pre" \
              "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"
          else
            # 稳定版：覆盖 latest
            docker buildx imagetools create -t "${IMAGE}:latest" \
              "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"
          fi
